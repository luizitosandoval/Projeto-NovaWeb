<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - NexTech Simples</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header id="topo">
        <div class="container">
            <h1>NexTech - Contato</h1>
            <nav>
                <ul style="display: flex; align-items: center; gap: 20px;">
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="produtos.html">Produtos</a></li>
                    <li><a href="contato.html">Contato</a></li>
                    <li><button id="themeToggle">🌓 Tema</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section>
            <h2>Entre em Contato</h2>
            <p>Tem alguma dúvida ou quer fazer um orçamento? Mande uma mensagem para nós!</p>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 30px;">
                <!-- Formulário Simples -->
                <form style="display: flex; flex-direction: column; gap: 15px;">
                    <div style="display: flex; flex-direction: column; gap: 5px;">
                        <label for="nome" style="font-weight: 600; font-size: 14px;">Nome</label>
                        <input type="text" id="nome" placeholder="Seu nome completo" style="padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color); color: var(--text-main);">
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 5px;">
                        <label for="email" style="font-weight: 600; font-size: 14px;">Email</label>
                        <input type="email" id="email" placeholder="seu@email.com" style="padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color); color: var(--text-main);">
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 5px;">
                        <label for="msg" style="font-weight: 600; font-size: 14px;">Mensagem</label>
                        <textarea id="msg" rows="5" placeholder="Como podemos ajudar?" style="padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color); color: var(--text-main);"></textarea>
                    </div>

                    <button type="button" class="btn" style="border: none; cursor: pointer; width: fit-content; padding: 12px 24px;">Enviar Mensagem</button>
                </form>

                <!-- Informações de Contato -->
                <div style="display: flex; flex-direction: column; gap: 20px;">
                    <div>
                        <h3 style="margin-bottom: 5px;">📧 Email</h3>
                        <p style="color: var(--text-secondary); margin: 0;">contato@nextech.com</p>
                    </div>
                    <div>
                        <h3 style="margin-bottom: 5px;">📞 Telefone</h3>
                        <p style="color: var(--text-secondary); margin: 0;">(11) 99999-9999</p>
                    </div>
                    <div>
                        <h3 style="margin-bottom: 5px;">📍 Endereço</h3>
                        <p style="color: var(--text-secondary); margin: 0;">Av. Tecnologia, 1000 - Centro, São Paulo - SP</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 - NexTech</p>
        </div>
    </footer>

    <button id="backToTop" title="Voltar ao topo">↑</button>
    <script src="../js/script.js"></script>
</body>
</html>
