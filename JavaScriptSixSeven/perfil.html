<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Bem vindo ao Perfil</h1>
    </header>
    <main>
        <form class="form">
            <div class="alert alert-info" role="alert" id="mensagem" style="display: none;">
                <p>BH é Nois</p>
            </div>
            <div class="form-group">
                <img src="fotos/Bolsonaro.jpg" alt="Foto De Perfil" width="150"
                onmouseover="console.log('Mouse sobre a imagem!')">
            </div>

            <div class="form-group">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu Nome">
            </div>

            <div class="form-group">
                <label for="nascimento" class="form-label">Nascimento: </label>
                <input type="date" class="form-control" id="nascimento" name="nascimento" value="">
            </div>

            <div class="form-group">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" class="form-control" id="cpf" name="cpf" placeholder="Seu CPF" onblur="validaCpf()">
            </div>

            <div class="form-group">
                <label>Genero: </label>
                <div class="form-check">
                    <input type="radio" class="form-check-input" id="masculino" name="genero" value="masculino">
                    <label for="masculino" class="form-check-label">Masculino</label>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="feminino" name="genero" value="feminino">
                        <label for="feminino" class="form-check-label">Feminino</label>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="alienigena" name="genero" value="alienigena">
                        <label for="alienigena" class="form-check-label">Alienigena</label>
            </div>
            
            <div class="form-group">
                <label for="estado"> Estado: </label>
                <select class="form-control" id="estado" name="estado">
                    <option value="">Selecione um estado</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </div>


            <div class="form-group">
                <label for="termos" class="form-label">Aceito os termos claramente sem saber pq ninguem liga pros termos</label>
                <input type="checkbox" class="form-check-input" id="termos" name="termos">
            </div>

            <div class="form-group">
                <button type="button" class="btn btn-primary" onclick="Salvar()">Salvar</button>
            </div>
        </form>
    </main>
    <script type="text/javascript">
        function mensagem() {
            const msg = document.querySelector('#mensagem');
            msg.style.display = 'block';
            msg.textContent = 'Cadastro Concluido - BH é Nois tmj 67';
        }

        function validaCpf() {
            const cpf = document.querySelector('#cpf').value;
            console.log('CPF:', cpf);
            if (cpf.length !== 11) {
                alert('CPF inválido! Deve conter 11 dígitos.');
            } else {
                alert('CPF válido!');
            }
        }

    </script>
</body>
</html>
