
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 15 - JavaScript em Formulários</title>
    <link rel="stylesheet" href="/aula15HTML/formularioJS.css">
    <script src="/aula15HTML/formularioJS.js"></script>
</head>
<body>

    <form onsubmit="cadastrar(event)">
        <h2>Formulário de Cadastro</h2>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome"
               placeholder="Digite seu nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email"
               placeholder="Digite seu e-mail" required>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade"
               placeholder="Digite sua idade" required>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone"
               placeholder="Digite seu telefone" required>

        <button type="submit">Cadastrar</button>

        <p id="mensagem"></p>
    </form>
</body>
</html>
